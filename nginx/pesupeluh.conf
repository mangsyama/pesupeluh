# =========================================================================
# PESUPELUH PRODUCTION NGINX CONFIGURATION WITH SSL (KOMINFO BADUNG)
# =========================================================================

# 1. HTTP Server Block (Port 80) -> Redirect All Traffic to HTTPS (Port 443)
server {
    listen 80;
    listen [::]:80;
    server_name pesupeluh.badungkab.go.id 103.19.230.110 10.10.30.3 localhost _;

    server_tokens off;

    # Redirectsemua request HTTP ke HTTPS
    location / {
        return 301 https://$host$request_uri;
    }

    # Blokir akses file sensitif
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# 2. HTTPS Server Block (Port 443) -> Main Secure Server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pesupeluh.badungkab.go.id 103.19.230.110 10.10.30.3 localhost _;

    root /var/www/pesupeluh/public;
    index index.php index.html index.htm;
    charset utf-8;
    client_max_body_size 100m;

    # ==========================================
    # SSL CERTIFICATES CONFIGURATION (KOMINFO)
    # ==========================================
    ssl_certificate /etc/nginx/ssl/all_in_one.crt;
    ssl_certificate_key /etc/nginx/ssl/badungkab_go_id.key;

    # SSL Optimization & Security Hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ==========================================
    # SECURITY HARDENING (PENGAMANAN JARINGAN)
    # ==========================================
    server_tokens off;

    # Anti-Clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Anti-XSS Protection
    add_header X-XSS-Protection "1; mode=block" always;

    # Anti-MIME Sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Referrer Policy & HSTS
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ANTI-HACKER: hanya izinkan metode HTTP aman
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$ ) {
        return 444;
    }

    # ANTI-HACKER: Blokir file bersimbol titik (.env, .git, dll)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ==========================================
    # KERNEL OPTIMIZATION & TIMEOUT TUNING
    # ==========================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_body_timeout 60;
    client_header_timeout 12;
    send_timeout 10;

    # ==========================================
    # FASTCGI BUFFERING (Mencegah I/O Disk Lambat)
    # ==========================================
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    fastcgi_busy_buffers_size 64k;
    fastcgi_temp_file_write_size 64k;

    # ==========================================
    # GZIP COMPRESSION SETUP
    # ==========================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/svg+xml
        image/x-icon
        text/css
        text/javascript
        text/plain
        text/x-component;

    # ==========================================
    # LOCATION BLOCKS
    # ==========================================

    # 1. Static Asset Caching (JS, CSS, Fonts, Images)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff2|woff|ttf|svg|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform, max-age=31536000, immutable";
        access_log off;
        try_files $uri $uri/ =404;
    }

    # 2. Main Application Routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 3. Secure Storage Asset Access (Anti-Backdoor PHP)
    location ^~ /storage {
        alias /var/www/pesupeluh/storage/app/public;
        
        # ANTI-HACKER: Tolak semua upaya eksekusi file PHP di dalam folder storage
        location ~ \.php$ {
            deny all;
        }

        try_files $uri $uri/ =404;
    }

    # 4. Laravel Reverb (Websocket & Apps API) Setup
    location ~ ^/(app|apps) {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        # Mencegah koneksi WebSocket terputus otomatis setelah 60 detik
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # 5. PHP-FPM Handler
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        
        # Pass actual host header from client
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param SERVER_NAME $host;
        
        # HTTPS Status Headers for Laravel
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        
        fastcgi_read_timeout 120;
        fastcgi_intercept_errors on;
    }
}
