server {
    listen 80;
    server_name pesupeluh.badungkab.go.id 103.19.230.110 localhost _;

    root /var/www/pesupeluh/public;
    index index.php index.html index.htm;
    charset utf-8;
    client_max_body_size 100m;

    # ==========================================
    # KERNEL OPTIMIZATION & TIMEOUT TUNING
    # ==========================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # ==========================================
    # FASTCGI BUFFERING (Mencegah I/O Disk Lambat)
    # ==========================================
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
    fastcgi_busy_buffers_size 64k;
    fastcgi_temp_file_write_size 64k;

    # ==========================================
    # GZIP COMPRESSION SETUP
    # ==========================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/svg+xml
        image/x-icon
        text/css
        text/javascript
        text/plain
        text/x-component;

    # ==========================================
    # LOCATION BLOCKS
    # ==========================================

    # Static Asset Caching (JS, CSS, Fonts, Images)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff2|woff|ttf|svg|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform, max-age=31536000, immutable";
        access_log off;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /storage {
        alias /var/www/pesupeluh/storage/app/public;
        try_files $uri $uri/ =404;
    }

    # Laravel Reverb (Websocket) Setup
    location /app {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PHP-FPM Handler
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        
        # Tambahan optimasi respon timeout untuk PHP
        fastcgi_read_timeout 60;
        fastcgi_intercept_errors on;
    }
}
