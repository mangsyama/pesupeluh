version: '3.8'

services:
  php:
    build:
      context: ./docker/php8.3-sqlsrv
      dockerfile: Dockerfile
    container_name: pesupeluh-php
    env_file:
      - ./.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/var/www/pesupeluh
    expose:
      - "9000"
    # PHP-FPM default port 9000, used by Nginx upstream

  nginx:
    image: nginx:latest
    container_name: pesupeluh-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/pesupeluh.conf:/etc/nginx/conf.d/default.conf
      - ./:/var/www/pesupeluh
    depends_on:
      - php

  redis:
    image: redis:7-alpine
    container_name: pesupeluh-redis
    ports:
      - "6379:6379"

# Networks are optional; Docker Compose uses a default network.
