services:
  php:
    build:
      context: .
      dockerfile: docker/php8.3-sqlsrv/Dockerfile
    container_name: pesupeluh-php
    restart: unless-stopped
    env_file:
      - ./.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app:/var/www/pesupeluh/app
      - ./config:/var/www/pesupeluh/config
      - ./routes:/var/www/pesupeluh/routes
      - ./resources:/var/www/pesupeluh/resources
      - ./lang:/var/www/pesupeluh/lang
      - ./storage:/var/www/pesupeluh/storage
      - ./bootstrap/cache:/var/www/pesupeluh/bootstrap/cache
      - ./database:/var/www/pesupeluh/database
      - ./.env:/var/www/pesupeluh/.env
      - ./vendor:/var/www/pesupeluh/vendor
      - ./public:/var/www/pesupeluh/public
    expose:
      - "9000"
    command: >
      sh -c "cd /var/www/pesupeluh &&
      if [ -z \"\$(grep APP_KEY= .env | cut -d= -f2)\" ]; then php artisan key:generate --force; fi &&
      php artisan migrate --force || true &&
      php-fpm"
    depends_on:
      - redis

  nginx:
    image: nginx:1.27-alpine
    container_name: pesupeluh-nginx
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/pesupeluh.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./:/var/www/pesupeluh:ro
    depends_on:
      - php

  redis:
    image: redis:7-alpine
    container_name: pesupeluh-redis
    restart: unless-stopped

  reverb:
    build:
      context: .
      dockerfile: docker/php8.3-sqlsrv/Dockerfile
    container_name: pesupeluh-reverb
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - ./app:/var/www/pesupeluh/app
      - ./config:/var/www/pesupeluh/config
      - ./routes:/var/www/pesupeluh/routes
      - ./storage:/var/www/pesupeluh/storage
      - ./bootstrap/cache:/var/www/pesupeluh/bootstrap/cache
      - ./database:/var/www/pesupeluh/database
      - ./.env:/var/www/pesupeluh/.env
      - ./vendor:/var/www/pesupeluh/vendor
    expose:
      - "8080"
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    depends_on:
      - php
      - redis

  queue-worker:
    build:
      context: .
      dockerfile: docker/php8.3-sqlsrv/Dockerfile
    container_name: pesupeluh-queue-worker
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - ./app:/var/www/pesupeluh/app
      - ./config:/var/www/pesupeluh/config
      - ./routes:/var/www/pesupeluh/routes
      - ./storage:/var/www/pesupeluh/storage
      - ./bootstrap/cache:/var/www/pesupeluh/bootstrap/cache
      - ./database:/var/www/pesupeluh/database
      - ./.env:/var/www/pesupeluh/.env
      - ./vendor:/var/www/pesupeluh/vendor
    command: php artisan queue:work --tries=3 --timeout=30
    depends_on:
      - php
      - redis

  scheduler:
    build:
      context: .
      dockerfile: docker/php8.3-sqlsrv/Dockerfile
    container_name: pesupeluh-scheduler
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - ./app:/var/www/pesupeluh/app
      - ./config:/var/www/pesupeluh/config
      - ./routes:/var/www/pesupeluh/routes
      - ./storage:/var/www/pesupeluh/storage
      - ./bootstrap/cache:/var/www/pesupeluh/bootstrap/cache
      - ./database:/var/www/pesupeluh/database
      - ./.env:/var/www/pesupeluh/.env
      - ./vendor:/var/www/pesupeluh/vendor
    command: php artisan schedule:work
    depends_on:
      - php
      - redis

  wa-gateway:
    build:
      context: ./wa-gateway
      dockerfile: Dockerfile
    container_name: pesupeluh-wa-gateway
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./wa-gateway/auth_sessions:/app/auth_sessions

