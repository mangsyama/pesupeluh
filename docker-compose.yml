version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pesupeluh:latest
    container_name: pesupeluh_app
    expose:
      - "9000"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8082
    volumes:
      - ./storage:/var/www/html/storage
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    container_name: pesupeluh_nginx
    depends_on:
      - app
    ports:
      - "8082:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
